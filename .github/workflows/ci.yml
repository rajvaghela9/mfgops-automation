name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Test
        run: make test

  # ──────────────────────────────────────────────────────────────
  # Guards a freshly scaffolded repo against publishing placeholder
  # artifacts. Once this job has passed, it has done its job and is safe
  # to delete — remove this job, .github/scripts/scaffold-guard.sh, and the
  # `scaffold-check` target in the Makefile. Leaving it in place is also
  # fine; it is a no-op once the repo is customized.
  # ──────────────────────────────────────────────────────────────
  scaffold-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check scaffold has been customized
        if: github.repository != 'Infoblox-CTO/ib.python-template'
        run: ./.github/scripts/scaffold-guard.sh

  build:
    needs: [lint, test, scaffold-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      staging-image: ${{ steps.build-image.outputs.staging-image }}
      staging-chart: ${{ steps.package-chart.outputs.staging-chart }}
      version: ${{ steps.version.outputs.full-version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "full-version=$(make show-image-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build-image
        uses: Infoblox-CTO/devops.finalizebuild-workflow/.github/actions/build-image@v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          version: ${{ steps.version.outputs.full-version }}
          build-args: |
            VERSION=${{ steps.version.outputs.full-version }}
            GIT_HASH=${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
          wiz-client-id: ${{ secrets.WIZ_CLIENT_ID }}
          wiz-client-secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Resolve chart directory
        id: chart
        run: |
          shopt -s nullglob
          charts=(helm/*/Chart.yaml)
          if [[ ${#charts[@]} -ne 1 ]]; then
            echo "::error::expected exactly one chart under helm/, found ${#charts[@]}. Set chart-path explicitly." >&2
            exit 1
          fi
          echo "dir=$(dirname "${charts[0]}")" >> "$GITHUB_OUTPUT"

      - name: Set unique chart name
        run: |
          sed -i "s/^name: .*/name: ${{ env.IMAGE_NAME }}/" "${{ steps.chart.outputs.dir }}/Chart.yaml"

      - name: Package and push chart
        id: package-chart
        uses: Infoblox-CTO/devops.finalizebuild-workflow/.github/actions/package-chart@v1
        with:
          chart-path: ${{ steps.chart.outputs.dir }}
          version: ${{ steps.version.outputs.full-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    uses: Infoblox-CTO/devops.finalizebuild-workflow/.github/workflows/trigger-finalize.yml@v1
    secrets: inherit
    with:
      images: ${{ needs.build.outputs.staging-image }}
      charts: ${{ needs.build.outputs.staging-chart }}
      version: ${{ needs.build.outputs.version }}

  post-finalize:
    needs: [build, finalize]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post-finalize summary
        run: |
          FINALIZE_RESULT="${{ needs.finalize.result }}"
          if [[ "$FINALIZE_RESULT" == "success" ]]; then
            ICON="✓"; LABEL="Passed"
          elif [[ "$FINALIZE_RESULT" == "skipped" ]]; then
            ICON="⊘"; LABEL="Skipped"
          else
            ICON="✗"; LABEL="Failed"
          fi
          {
            echo "### Post-Finalize — ${LABEL} ${ICON}"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Build result | \`${{ needs.build.result }}\` |"
            echo "| Finalize result | \`${FINALIZE_RESULT}\` |"
            echo "| Staging image | \`${{ needs.build.outputs.staging-image }}\` |"
            echo "| Version | \`${{ needs.build.outputs.version }}\` |"
          } >> $GITHUB_STEP_SUMMARY
      - name: Fail if finalize did not succeed
        if: needs.finalize.result != 'success' && needs.finalize.result != 'skipped'
        run: exit 1
